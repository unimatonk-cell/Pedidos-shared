<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Libro de Pedidos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --paper: #FAF7F1;
  --paper-dim: #F1ECE1;
  --ink: #21262B;
  --ink-soft: #5C6570;
  --line: #DAD3C3;
  --sage: #46644F;
  --sage-light: #E4ECE3;
  --brick: #A8402B;
  --brick-light: #F5E2DC;
  --gold: #B4862F;
  --gold-light: #F2E8D3;
  --brand-brown: #48301B;
  --white: #FFFFFF;
  --shadow: 0 1px 2px rgba(33,38,43,0.06), 0 4px 14px rgba(33,38,43,0.05);
}

*{ box-sizing: border-box; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

html,body{
  margin:0; padding:0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.app{
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 0 100px 0;
  position: relative;
}

/* ---------- Header ---------- */
header{
  padding: 28px 20px 18px 20px;
  border-bottom: 2px solid var(--ink);
  background: var(--paper);
  position: relative;
}
.brand{
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo{
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  object-fit: contain;
}
.eyebrow{
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--brand-brown);
  font-weight: 700;
  margin-bottom: 6px;
}
h1{
  font-size: 26px;
  margin: 0;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.stats{
  display: flex;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.stat{
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink-soft);
  white-space: nowrap;
}
.stat b{ color: var(--ink); font-weight: 700; }
.stat.warn{ background: var(--brick-light); border-color: #E3C4B8; color: var(--brick); }
.stat.warn b{ color: var(--brick); }

/* ---------- Controls ---------- */
.controls{
  padding: 16px 20px 0 20px;
  position: sticky;
  top: 0;
  background: var(--paper);
  z-index: 5;
}
.search{
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--white);
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  color: var(--ink);
  outline: none;
}
.search:focus{ border-color: var(--sage); }
.search::placeholder{ color: #A5AAB0; }

.sort-row{
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
  position: relative;
}
.sort-btn{
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 8px 13px;
  border-radius: 20px;
  border: 1.5px solid var(--line);
  background: var(--white);
  color: var(--ink-soft);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
}
.sort-btn:hover{ border-color: var(--sage); color: var(--sage); }
.sort-btn.open{
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.sort-btn .sort-icon{
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}
.sort-btn .sort-chevron{
  width: 8px;
  height: 8px;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
.sort-btn.open .sort-chevron{ transform: rotate(180deg); }

.sort-menu{
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 220px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 6px;
  z-index: 20;
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.sort-menu.show{
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.sort-option{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
}
.sort-option:hover{ background: var(--paper-dim); }
.sort-option.active{ color: var(--sage); }
.sort-option .check{
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  color: var(--sage);
  visibility: hidden;
}
.sort-option.active .check{ visibility: visible; }

.tabs{
  display: flex;
  gap: 6px;
  margin-top: 12px;
  overflow-x: auto;
  padding-bottom: 12px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar{ display: none; }
.tab{
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--line);
  background: var(--white);
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab.active{
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.btn-export{
  position: absolute;
  top: 24px;
  right: 20px;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  line-height: 1;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--white);
  color: var(--ink-soft);
  cursor: pointer;
}
.btn-export:hover{ border-color: var(--sage); color: var(--sage); }
.btn-export:active{ transform: scale(0.94); }

/* ---------- Order list ---------- */
.list{
  padding: 12px 20px 0 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 4px;
}

.empty{
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-soft);
}
.empty .big{
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink);
  font-weight: 700;
  margin-bottom: 6px;
}

.ticket{
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 4px;
  position: relative;
  box-shadow: var(--shadow);
  animation: rise 0.25s ease;
  overflow: hidden;
}
@keyframes rise{
  from{ opacity: 0; transform: translateY(6px); }
  to{ opacity: 1; transform: translateY(0); }
}
/* perforated top edge */
.ticket::before{
  content: "";
  display: block;
  height: 8px;
  background-image: radial-gradient(circle at 8px 0, var(--paper) 5px, transparent 5.5px);
  background-size: 16px 8px;
  background-repeat: repeat-x;
}

.ticket-head{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 14px 16px 0 16px;
  gap: 10px;
  background: var(--white);
}
.ticket-num{
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
}
.customer{
  font-size: 17px;
  font-weight: 700;
  margin-top: 2px;
}
.phone{
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 1px;
}
.price{
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 15px;
  white-space: nowrap;
  text-align: right;
}
.date{
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  text-align: right;
  margin-top: 2px;
}
.paid-date{
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--sage);
  text-align: right;
  margin-top: 2px;
}

.details{
  padding: 10px 16px 0 16px;
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  white-space: pre-wrap;
}

.items{
  padding: 10px 16px 0 16px;
}
.item-line{
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 14px;
  padding: 3px 0;
  color: var(--ink);
}
.item-line .iname{
  flex: 1;
  min-width: 0;
  word-break: break-word;
}
.item-line .iqty{
  color: var(--ink-soft);
  font-size: 12px;
  font-family: 'Space Mono', monospace;
}
.item-line .isub{
  font-family: 'Space Mono', monospace;
  white-space: nowrap;
  text-align: right;
}
.total-line{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 16px 0 16px;
  margin-top: 4px;
  border-top: 1.5px solid var(--ink);
}
.total-line .tlabel{
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 700;
}
.total-line .tvalue{
  font-family: 'Space Mono', monospace;
  font-size: 18px;
  font-weight: 700;
}
.notes{
  padding: 6px 16px 0 16px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--ink-soft);
  font-style: italic;
  white-space: pre-wrap;
}

.divider{
  border: none;
  border-top: 1px dashed var(--line);
  margin: 12px 16px 0 16px;
}

.ticket-foot{
  display: flex;
  gap: 8px;
  padding: 12px 16px 14px 16px;
  flex-wrap: wrap;
}

.chip{
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  padding: 8px 12px;
  border-radius: 20px;
  border: 1.5px solid var(--line);
  background: var(--paper-dim);
  color: var(--ink-soft);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.1s ease;
  user-select: none;
}
.chip:active{ transform: scale(0.96); }
.chip.on-paid{
  background: var(--sage-light);
  border-color: #C6D8C8;
  color: var(--sage);
}
.chip.on-delivered{
  background: var(--gold-light);
  border-color: #E3D0A0;
  color: var(--gold);
}
.chip.off{
  background: var(--brick-light);
  border-color: #E3C4B8;
  color: var(--brick);
}

.icon-btn{
  margin-left: auto;
  display: inline-flex;
  gap: 6px;
}
.icon-btn button{
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  background: var(--white);
  color: var(--ink-soft);
  font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn button:active{ background: var(--paper-dim); }

/* ---------- FAB ---------- */
.fab{
  position: fixed;
  bottom: 24px;
  right: 20px;
  width: 58px; height: 58px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  border: none;
  font-size: 28px;
  box-shadow: 0 6px 18px rgba(33,38,43,0.35);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 20;
  max-width: 520px;
}
.fab:active{ transform: scale(0.95); }

/* ---------- Modal ---------- */
.overlay{
  position: fixed; inset: 0;
  background: rgba(33,38,43,0.45);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
.overlay.show{ display: flex; }
.sheet{
  background: var(--paper);
  width: 100%;
  max-width: 560px;
  border-radius: 18px 18px 0 0;
  padding: 20px 20px 28px 20px;
  max-height: 88vh;
  overflow-y: auto;
  animation: slideup 0.22s ease;
}
@keyframes slideup{
  from{ transform: translateY(30px); opacity: 0.5; }
  to{ transform: translateY(0); opacity: 1; }
}
.sheet h2{
  margin: 0 0 4px 0;
  font-size: 20px;
  font-weight: 800;
}
.sheet .sub{
  font-size: 13px; color: var(--ink-soft); margin-bottom: 18px;
}
.field{ margin-bottom: 14px; }
.field label{
  display: block;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  margin-bottom: 6px;
  font-weight: 700;
}
.field input, .field textarea{
  width: 100%;
  padding: 12px 13px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--white);
  font-family: 'Manrope', sans-serif;
  font-size: 15px;
  color: var(--ink);
  outline: none;
  resize: vertical;
}
.field input:focus, .field textarea:focus{ border-color: var(--sage); }
.row2{ display: flex; gap: 10px; }
.row2 .field{ flex: 1; }

.items-field{ margin-bottom: 14px; }
.item-row{
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.item-row input.iname-input{
  flex: 1;
  min-width: 0;
}
.item-row input.iqty-input{
  width: 52px;
  text-align: center;
  flex-shrink: 0;
}
.item-row input.iprice-input{
  width: 92px;
  flex-shrink: 0;
}
.item-row input{
  padding: 10px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  background: var(--white);
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
  color: var(--ink);
  outline: none;
}
.item-row input:focus{ border-color: var(--sage); }
.item-row .item-remove{
  width: 34px; height: 34px;
  border-radius: 8px;
  border: 1.5px solid var(--line);
  background: var(--white);
  color: var(--brick);
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.add-item-btn{
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1.5px dashed var(--line);
  background: transparent;
  color: var(--sage);
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  margin-top: 2px;
}
.add-item-btn:active{ background: var(--sage-light); }
.sheet-total{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 12px;
  margin-top: 6px;
  border-top: 1.5px solid var(--ink);
}
.sheet-total .tlabel{
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 700;
}
.sheet-total .tvalue{
  font-family: 'Space Mono', monospace;
  font-size: 20px;
  font-weight: 700;
}

.sheet-actions{
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.btn{
  flex: 1;
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}
.btn-primary{ background: var(--ink); color: var(--paper); }
.btn-primary:active{ opacity: 0.85; }
.btn-ghost{ background: var(--paper-dim); color: var(--ink-soft); border: 1.5px solid var(--line); }

/* ---------- Payment method options ---------- */
.payment-options{
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 4px;
}
.payment-option{
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--white);
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
.payment-option:active{ background: var(--paper-dim); }
.payment-option .picon{
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--sage-light);
  color: var(--sage);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.payment-option .picon svg{
  width: 19px;
  height: 19px;
  display: block;
}
.payment-option .picon.sinpe-logo{
  background: var(--white);
  border: 1px solid var(--line);
  padding: 5px;
}
.payment-option .picon.sinpe-logo img{
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.toast{
  position: fixed;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-family: 'Space Mono', monospace;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 60;
  white-space: nowrap;
}
.toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

.loading{
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-soft);
  font-family: 'Space Mono', monospace;
  font-size: 13px;
}
</style>
<meta name="theme-color" content="#46644F">
</head>
<body>

<div class="app">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCyIxTK_m7ruIqlVO6HJzt9nPDjnqqbPeE",
  authDomain: "pedidos-7059a.firebaseapp.com",
  projectId: "pedidos-7059a",
  storageBucket: "pedidos-7059a.firebasestorage.app",
  messagingSenderId: "799317396842",
  appId: "1:799317396842:web:272753d2ec7b6541c76913"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const ordersCol = collection(db, 'orders');
const archiveCol = collection(db, 'orders_archive');

let orders = [];
let currentFilter = 'all';
let searchTerm = '';
let currentSort = 'date-asc';
let editingId = null;

const listEl = document.getElementById('list');
const statsEl = document.getElementById('stats');
const overlay = document.getElementById('overlay');
const toastEl = document.getElementById('toast');

const PAYMENT_LABELS = {
  tarjeta: 'Tarjeta',
  efectivo: 'Efectivo',
  sinpe: 'SINPE'
};

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1600);
}

// Real-time sync: fires whenever ANY device adds/edits/deletes an order.
let migratedOnce = false;
onSnapshot(ordersCol, (snapshot) => {
  orders = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
  if(!migratedOnce){
    migratedOnce = true;
    assignMissingOrderNumbers();
  }
}, (err) => {
  console.error(err);
  showToast('Sin conexión con la base de datos compartida');
});

// One-time migration: give any order created before this update a
// permanent order number (oldest first), so it stays fixed from now on.
async function assignMissingOrderNumbers(){
  const missing = orders.filter(o => !o.orderNumber);
  if(missing.length === 0) return;

  let next = orders.reduce((max, o) => Math.max(max, Number(o.orderNumber) || 0), 0) + 1;
  const toAssign = [...missing].sort((a,b) => (a.createdAt||0) - (b.createdAt||0));

  for(const o of toAssign){
    try{
      await updateDoc(doc(db, 'orders', o.id), { orderNumber: next });
      next++;
    }catch(err){
      console.error('No se pudo asignar número de pedido a', o.id, err);
    }
  }
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('es-ES', { month: 'short', day: 'numeric', year: 'numeric' });
}

function csvEscape(value){
  const s = String(value ?? '');
  if(/[",\n]/.test(s)){
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

// Removes accents/diacritics (á→a, ñ→n, etc.) so the CSV is plain ASCII
// and never runs into encoding-mismatch issues in any spreadsheet app.
function stripAccents(value){
  const s = String(value ?? '');
  return s
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '') // strip combining accent marks
    .replace(/ñ/g, 'n').replace(/Ñ/g, 'N');
}

function itemsToText(items){
  if(!Array.isArray(items) || items.length === 0) return '';
  return items.map(it => `${it.name || ''} x${it.qty || 0} @ ${it.price || 0}`).join(' | ');
}

// Exports every order that was ever COMPLETED (archived) — cancelled
// orders never make it into the archive, so they never appear here.
async function exportOrdersToCsv(){
  try{
    showToast('Preparando CSV…');

    const archiveSnap = await getDocs(archiveCol);
    const archived = archiveSnap.docs.map(d => ({ id: d.id, ...d.data(), _status: 'Eliminado' }));

    const activeIds = new Set(orders.map(o => o.id));
    const activeRows = orders.map(o => ({ ...o, _status: 'Activo' }));
    // Avoid duplicating an order that's both active and (stale) archived.
    const archivedRows = archived.filter(o => !activeIds.has(o.id));

    const all = [...activeRows, ...archivedRows]
      .sort((a,b) => (Number(a.orderNumber)||0) - (Number(b.orderNumber)||0));

    const headers = [
      'Numero de pedido', 'Cliente', 'Telefono', 'Productos', 'Total',
      'Pagado', 'Metodo de pago', 'Fecha de pago', 'Entregado', 'Fecha de entrega', 'Notas',
      'Estado', 'Creado', 'Eliminado el'
    ];

    const rows = all.map(o => [
      o.orderNumber || '',
      o.customerName || '',
      o.phone || '',
      itemsToText(o.items),
      orderTotal(o),
      o.paid ? 'Si' : 'No',
      o.paid ? (PAYMENT_LABELS[o.paymentMethod] || '') : '',
      o.paidDate || '',
      o.delivered ? 'Si' : 'No',
      o.date || '',
      o.notes || '',
      o._status,
      o.createdAt ? new Date(o.createdAt).toISOString().slice(0,10) : '',
      o.deletedAt ? new Date(o.deletedAt).toISOString().slice(0,10) : ''
    ]);

    const csvLines = [headers, ...rows]
      .map(row => row.map(v => csvEscape(stripAccents(v))).join(','))
      .join('\r\n');

    // "sep=," forces Excel to read this as comma-separated even on systems
    // where the regional default is semicolon (common in Spanish locales) —
    // without it, Excel can dump every value into a single column.
    const csvContent = 'sep=,\r\n' + csvLines;

    // Plain ASCII now (accents stripped), so no BOM/encoding issues to worry about.
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `pedidos_origen_despensa_${today}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast(`CSV descargado (${all.length} pedidos)`);
  }catch(err){
    console.error('Error exportando CSV', err);
    showToast('No se pudo exportar el CSV');
  }
}

document.getElementById('exportCsvBtn').addEventListener('click', exportOrdersToCsv);

function fmtMoney(n){
  const num = Number(n) || 0;
  return '₡' + num.toLocaleString('es-CR', { maximumFractionDigits: 2 });
}

function orderTotal(o){
  if(o.items && o.items.length){
    return o.items.reduce((sum, it) => sum + (Number(it.qty)||0) * (Number(it.price)||0), 0);
  }
  const legacy = parseFloat(String(o.price||'').replace(/[^\d.-]/g,''));
  return isNaN(legacy) ? 0 : legacy;
}

function matchesFilter(o){
  if(currentFilter === 'unpaid') return !o.paid;
  if(currentFilter === 'undelivered') return !o.delivered;
  if(currentFilter === 'done') return o.paid && o.delivered;
  return true;
}
function matchesSearch(o){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  const itemText = (o.items||[]).map(it=>it.name).join(' ');
  return (o.customerName||'').toLowerCase().includes(t)
    || (o.details||'').toLowerCase().includes(t)
    || itemText.toLowerCase().includes(t);
}

function renderStats(){
  const unpaid = orders.filter(o=>!o.paid).length;
  const undelivered = orders.filter(o=>!o.delivered).length;
  statsEl.innerHTML = `
    <div class="stat"><b>${orders.length}</b> pedido${orders.length===1?'':'s'} en total</div>
    <div class="stat ${unpaid? 'warn':''}"><b>${unpaid}</b> sin cancelar</div>
    <div class="stat ${undelivered? 'warn':''}"><b>${undelivered}</b> por entregar</div>
  `;
}

function render(){
  renderStats();

  const sorted = [...orders].sort((a,b) => {
    switch(currentSort){
      case 'num-desc':
        return (Number(b.orderNumber)||0) - (Number(a.orderNumber)||0);
      case 'date-asc':
      default:
        return (a.date||'').localeCompare(b.date||'') || (a.createdAt||0) - (b.createdAt||0);
    }
  });
  const visible = sorted.filter(o=> matchesFilter(o) && matchesSearch(o));

  if(orders.length === 0){
    listEl.innerHTML = `<div class="empty"><div class="big">No hay pedidos, estamos repobres</div>Dele al botón + para registrar el primer pedido.</div>`;
    return;
  }
  if(visible.length === 0){
    listEl.innerHTML = `<div class="empty"><div class="big">Nada por acá</div>Pruebe con otro filtro o búsqueda.</div>`;
    return;
  }

  listEl.innerHTML = visible.map(o => {
    const num = String(o.orderNumber || '').padStart(3,'0');
    const paidMethodLabel = o.paid && o.paymentMethod ? ` · ${PAYMENT_LABELS[o.paymentMethod] || ''}` : '';
    return `
    <div class="ticket" data-id="${o.id}">
      <div class="ticket-head">
        <div>
          <div class="ticket-num">№ ${num}</div>
          <div class="customer">${escapeHtml(o.customerName)}</div>
          ${o.phone ? `<div class="phone">${escapeHtml(o.phone)}</div>` : ''}
        </div>
        <div>
          <div class="date">${fmtDate(o.date)}</div>
          ${o.paidDate ? `<div class="paid-date">Cancelado: ${fmtDate(o.paidDate)}${paidMethodLabel}</div>` : ''}
        </div>
      </div>
      ${(o.items && o.items.length) ? `
        <div class="items">
          ${o.items.map(it => `
            <div class="item-line">
              <div class="iname">${escapeHtml(it.name)} ${Number(it.qty) > 1 ? `<span class="iqty">×${it.qty}</span>` : ''}</div>
              <div class="isub">${fmtMoney((Number(it.qty)||0) * (Number(it.price)||0))}</div>
            </div>
          `).join('')}
        </div>
        <div class="total-line">
          <div class="tlabel">Total</div>
          <div class="tvalue">${fmtMoney(orderTotal(o))}</div>
        </div>
      ` : `
        <div class="details">${escapeHtml(o.details)}</div>
        ${o.price ? `<div class="total-line"><div class="tlabel">Total</div><div class="tvalue">${escapeHtml(o.price)}</div></div>` : ''}
      `}
      ${o.notes ? `<div class="notes">${escapeHtml(o.notes)}</div>` : ''}
      <hr class="divider">
      <div class="ticket-foot">
        <div class="chip ${o.paid ? 'on-paid' : 'off'}" data-action="paid" data-id="${o.id}">
          ${o.paid ? `✓ Cancelado${paidMethodLabel}` : '○ Sin cancelar'}
        </div>
        <div class="chip ${o.delivered ? 'on-delivered' : 'off'}" data-action="delivered" data-id="${o.id}">
          ${o.delivered ? '✓ Entregado' : '○ Sin entregar'}
        </div>
        <div class="icon-btn">
          <button data-action="edit" data-id="${o.id}" aria-label="Editar">✎</button>
          <button data-action="delete" data-id="${o.id}" aria-label="Eliminar">✕</button>
        </div>
      </div>
    </div>
  `}).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Event delegation for ticket actions
listEl.addEventListener('click', async (e) => {
  const target = e.target.closest('[data-action]');
  if(!target) return;
  const id = target.dataset.id;
  const action = target.dataset.action;
  const order = orders.find(o=>o.id===id);
  if(!order) return;

  try{
    if(action === 'paid'){
      if(order.paid){
        // Marked as paid already -> revert to unpaid, clear payment info.
        await updateDoc(doc(db, 'orders', id), {
          paid: false,
          paidDate: null,
          paymentMethod: null
        });
      } else {
        // Going from unpaid -> paid: ask how they paid first.
        openPaymentChoice(order);
      }
    } else if(action === 'delivered'){
      await updateDoc(doc(db, 'orders', id), { delivered: !order.delivered });
    } else if(action === 'delete'){
      openDeleteChoice(order);
    } else if(action === 'edit'){
      openSheet(order);
    }
  }catch(err){
    console.error(err);
    showToast('No se pudo guardar — revisa tu conexión');
  }
});

// ---------- Payment method choice: tarjeta / efectivo / sinpe ----------
let pendingPaymentId = null;
const paymentOverlay = document.getElementById('paymentOverlay');

function openPaymentChoice(order){
  pendingPaymentId = order.id;
  document.getElementById('paymentSub').textContent =
    `№ ${String(order.orderNumber||'').padStart(3,'0')} — ${order.customerName}`;
  paymentOverlay.classList.add('show');
}
function closePaymentChoice(){
  paymentOverlay.classList.remove('show');
  pendingPaymentId = null;
}

document.getElementById('paymentAbortBtn').addEventListener('click', closePaymentChoice);
paymentOverlay.addEventListener('click', (e) => { if(e.target === paymentOverlay) closePaymentChoice(); });

paymentOverlay.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-method]');
  if(!btn) return;
  const id = pendingPaymentId;
  const method = btn.dataset.method;
  if(!id) return;
  try{
    await updateDoc(doc(db, 'orders', id), {
      paid: true,
      paidDate: new Date().toISOString().slice(0,10),
      paymentMethod: method
    });
    showToast(`Marcado como cancelado (${PAYMENT_LABELS[method]})`);
  }catch(err){
    console.error(err);
    showToast('No se pudo guardar — revisa tu conexión');
  }
  closePaymentChoice();
});

// ---------- Delete choice: completado (se archiva) vs. cancelado (se borra del todo) ----------
let pendingDeleteId = null;
const deleteOverlay = document.getElementById('deleteOverlay');

function openDeleteChoice(order){
  pendingDeleteId = order.id;
  document.getElementById('deleteSub').textContent =
    `№ ${String(order.orderNumber||'').padStart(3,'0')} — ${order.customerName}`;
  deleteOverlay.classList.add('show');
}
function closeDeleteChoice(){
  deleteOverlay.classList.remove('show');
  pendingDeleteId = null;
}

document.getElementById('deleteAbortBtn').addEventListener('click', closeDeleteChoice);
deleteOverlay.addEventListener('click', (e) => { if(e.target === deleteOverlay) closeDeleteChoice(); });

// Completado → se guarda una copia en orders_archive (por eso queda en el CSV)
// y luego se borra de la lista activa.
document.getElementById('deleteCompletedBtn').addEventListener('click', async () => {
  const id = pendingDeleteId;
  const order = orders.find(o => o.id === id);
  if(!order) return closeDeleteChoice();
  try{
    await setDoc(doc(db, 'orders_archive', id), {
      ...order,
      deletedAt: Date.now(),
      deleteReason: 'completado'
    });
    await deleteDoc(doc(db, 'orders', id));
    showToast('Pedido archivado en el historial');
  }catch(err){
    console.error(err);
    showToast('No se pudo eliminar — revisa tu conexión');
  }
  closeDeleteChoice();
});

// Cancelado → se borra directo de "orders" SIN pasar por "orders_archive",
// así nunca queda registrado en el CSV.
document.getElementById('deleteCancelledBtn').addEventListener('click', async () => {
  const id = pendingDeleteId;
  const order = orders.find(o => o.id === id);
  if(!order) return closeDeleteChoice();
  try{
    await deleteDoc(doc(db, 'orders', id));
    // Por si el pedido ya tuviera una copia archivada de antes, se purga también.
    await deleteDoc(doc(db, 'orders_archive', id)).catch(()=>{});
    showToast('Pedido cancelado y eliminado por completo');
  }catch(err){
    console.error(err);
    showToast('No se pudo eliminar — revisa tu conexión');
  }
  closeDeleteChoice();
});

// Filters
document.getElementById('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  currentFilter = tab.dataset.filter;
  render();
});

// Search
document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  render();
});

// Sort
const sortBtn = document.getElementById('sortBtn');
const sortMenu = document.getElementById('sortMenu');
const sortBtnLabel = document.getElementById('sortBtnLabel');
const sortLabels = {
  'date-asc': 'Fecha de entrega',
  'num-desc': '№ Pedido'
};

function closeSortMenu(){
  sortMenu.classList.remove('show');
  sortBtn.classList.remove('open');
  sortBtn.setAttribute('aria-expanded', 'false');
}

sortBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const willOpen = !sortMenu.classList.contains('show');
  sortMenu.classList.toggle('show', willOpen);
  sortBtn.classList.toggle('open', willOpen);
  sortBtn.setAttribute('aria-expanded', String(willOpen));
});

sortMenu.addEventListener('click', (e) => {
  const opt = e.target.closest('.sort-option');
  if(!opt) return;
  currentSort = opt.dataset.sort;
  sortBtnLabel.textContent = sortLabels[currentSort];
  document.querySelectorAll('.sort-option').forEach(o => o.classList.toggle('active', o.dataset.sort === currentSort));
  closeSortMenu();
  render();
});

document.addEventListener('click', (e) => {
  if(!sortMenu.contains(e.target) && e.target !== sortBtn){
    closeSortMenu();
  }
});

// ---------- Item rows in the add/edit form ----------
let formItems = [];
const itemRowsEl = document.getElementById('itemRows');
const sheetTotalEl = document.getElementById('sheetTotal');

function newItemRow(name='', qty=1, price=''){
  return { rowId: 'r_' + Math.random().toString(36).slice(2,9), name, qty, price };
}

function renderItemRows(){
  itemRowsEl.innerHTML = formItems.map(row => `
    <div class="item-row" data-row="${row.rowId}">
      <input class="iname-input" type="text" placeholder="Producto" value="${escapeAttr(row.name)}" data-field="name">
      <input class="iqty-input" type="number" min="1" step="1" value="${row.qty}" data-field="qty">
      <input class="iprice-input" type="number" min="0" step="0.01" placeholder="Precio" value="${row.price}" data-field="price">
      <button type="button" class="item-remove" data-remove="${row.rowId}" aria-label="Quitar producto">✕</button>
    </div>
  `).join('');
  updateSheetTotal();
}

function escapeAttr(s){
  return (s||'').replace(/"/g,'&quot;');
}

function updateSheetTotal(){
  const total = formItems.reduce((sum, r) => sum + (Number(r.qty)||0) * (Number(r.price)||0), 0);
  sheetTotalEl.textContent = fmtMoney(total);
}

itemRowsEl.addEventListener('input', (e) => {
  const rowEl = e.target.closest('.item-row');
  if(!rowEl) return;
  const rowId = rowEl.dataset.row;
  const row = formItems.find(r => r.rowId === rowId);
  if(!row) return;
  const field = e.target.dataset.field;
  row[field] = field === 'name' ? e.target.value : e.target.value;
  updateSheetTotal();
});

itemRowsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-remove]');
  if(!btn) return;
  formItems = formItems.filter(r => r.rowId !== btn.dataset.remove);
  if(formItems.length === 0) formItems.push(newItemRow());
  renderItemRows();
});

document.getElementById('addItemBtn').addEventListener('click', () => {
  formItems.push(newItemRow());
  renderItemRows();
});

// Add / Edit sheet
function openSheet(order){
  editingId = order ? order.id : null;
  document.getElementById('sheetTitle').textContent = order ? 'Editar pedido' : 'Nuevo pedido';
  document.getElementById('fName').value = order ? order.customerName : '';
  document.getElementById('fPhone').value = order ? order.phone : '';
  document.getElementById('fNotes').value = order ? order.notes : '';
  document.getElementById('fDate').value = order ? order.date : new Date().toISOString().slice(0,10);

  if(order && order.items && order.items.length){
    formItems = order.items.map(it => newItemRow(it.name, it.qty, it.price));
  } else if(order && order.details){
    // migrate a legacy free-text order into a single product row
    const legacyPrice = parseFloat(String(order.price||'').replace(/[^\d.-]/g,''));
    formItems = [newItemRow(order.details, 1, isNaN(legacyPrice) ? '' : legacyPrice)];
  } else {
    formItems = [newItemRow()];
  }
  renderItemRows();
  overlay.classList.add('show');
}
function closeSheet(){
  overlay.classList.remove('show');
  editingId = null;
}

document.getElementById('fabAdd').addEventListener('click', () => openSheet(null));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeSheet(); });

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = document.getElementById('fName').value.trim();
  const cleanItems = formItems
    .filter(r => r.name && r.name.trim())
    .map(r => ({ name: r.name.trim(), qty: Number(r.qty) || 1, price: Number(r.price) || 0 }));

  if(!name || cleanItems.length === 0){
    showToast('Agrega el nombre del cliente y al menos un producto');
    return;
  }
  const data = {
    customerName: name,
    phone: document.getElementById('fPhone').value.trim(),
    items: cleanItems,
    notes: document.getElementById('fNotes').value.trim(),
    date: document.getElementById('fDate').value || new Date().toISOString().slice(0,10),
  };

  try{
    if(editingId){
      await updateDoc(doc(db, 'orders', editingId), data);
      showToast('Pedido actualizado');
    } else {
      const newId = 'o_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      const nextNumber = orders.reduce((max, o) => Math.max(max, Number(o.orderNumber) || 0), 0) + 1;
      await setDoc(doc(db, 'orders', newId), {
        createdAt: Date.now(),
        orderNumber: nextNumber,
        paid: false,
        delivered: false,
        paidDate: null,
        paymentMethod: null,
        ...data
      });
      showToast('Pedido agregado');
    }
    closeSheet();
  }catch(err){
    console.error(err);
    showToast('No se pudo guardar — revisa tu conexión');
  }
});
</script>
